  D28:
    status: adopted
    date: "2026-10-27"
    date_adopted: "2026-10-27"
    topic: "How the OM/CM split interacts with the horizon-dependent range of option E (2050 flexibility-conditional range, 2025-2040 empirical band and conformal supplement)"
    source_task: "Task 13-1 - docs/task13_design.md section 0.2"
    found: >
      Arithmetically no ambiguity: mitigation = E x deterministic factor(year) is linear and monotone, so applying the range before or after the OM/CM split gives the same numbers. The open
      points are conventions: (1) the 2050 range is conditional on a flexibility assumption on the energy side only, the emission factors are not conditioned on the same assumption;
      (2) OM and CM are alternative proxies (D12), never components to be summed; (3) the conformal supplement maps through the factor unchanged but stays in its own columns;
      (4) MCTI factor uncertainty is not in any range.
    proposal: >
      Apply the energy end points through each factor after the split (avg, OM, CM each with its own central and range); state in range_basis that the factor is held at one MCTI year and is not part of the
      range; never sum OM and CM; keep the 2050 range labelled conditional (calibrated_label False) in every tCO2 row.
    options:
      post_split_per_factor: "Recommended."
      energy_range_only: "Report the range for TWh only and leave tCO2 as central values plus a note; simpler, loses the range where the article needs it."
    decided: >
      ADOPTED on 2026-10-27 (Task 13) by explicit user decision, as recommended in docs/task13_design.md 0.2. The energy-side range (2025-2040 empirical band, 2050 flexibility-conditional range phi 1.5 to L=1) is applied after the OM/CM split (arithmetically equal to applying it before; the documented and tested order). Emission factors are fixed point values, not conditioned on the same flexibility assumption, and range_basis says so explicitly (energy range only; emission factor fixed at the stated year, not included in range). OM and CM are alternative proxies and are never summed. The final 2050 figures therefore carry a partial uncertainty composition (energy-side conditional range + point-value emission factor), which must be stated in any article-facing text derived from the table.
    implemented_in: "curtailmit.results_writer (build_final_results, write_final_results, FinalResultsRow supersedes ResultsRow), mitigation.compute_mitigation (OM/CM columns, ModelProvenanceError), docs/methodology.md 2.3k; commit 57d9488 ('Task 13: final results layer ...')"

  D29:
