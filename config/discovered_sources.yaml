      MCTI margins and average factors exist only for completed years (config mcti.required_years 2020-2025). The projection grid is 2025/2030/2040/2050. The annual average factor varied
      between 0.0385 (2023) and 0.1263 (2021) tCO2/MWh over 2021-2025, so the choice matters to the tCO2 results.
    options:
