# Running log of data source discovery results.
# Populated via scripts/discovery_probe.py through discovery_probe_4.py.
# This is the source of truth for resource_id/package_id/URL discovery
# until formally merged into scenarios.yaml by a dedicated Claude Code task.

ons:
  base_url: "https://dados.ons.org.br/api/3/action/"

  curtailment_wind:
    status: confirmed
    package_id: restricao_coff_eolica_usi
    notes: >
      Monthly CSV/XLSX/PARQUET resources, naming pattern
      Restricoes_coff_eolicas-YYYY-MM. Confirmed via package_show.

  curtailment_solar:
    status: confirmed
    package_id: restricao_coff_fotovoltaica
    title: "Dados de Restricao de Operacao por Constrained-off de Usinas Fotovoltaicas"
    notes: >
      Mirrors the wind curtailment package structure.

  generation_by_source:
    status: confirmed
    package_id: balanco-energia-subsistema
    title: "Balanco de Energia nos Subsistemas"
    granularity: "One CSV resource per YEAR (not monthly), e.g. Balanco_de_Energia_Subsistema-2013.csv"
    confirmed_schema:
      - id_subsistema       # includes a 'SIN' row = national aggregate, satisfies OQ-1 directly
      - nom_subsistema
      - din_instante         # hourly or sub-hourly timestamp
      - val_gerhidraulica    # MW or MWh, hydro generation
      - val_gertermica       # thermal generation
      - val_gereolica        # wind generation
      - val_gersolar         # solar generation (NaN/0 pre-~2017, handle as 0, not an error)
      - val_carga            # system load
      - val_intercambio      # interchange
    computation: >
      Filter to id_subsistema == 'SIN'. For a given year, sum
      val_gereolica and val_gersolar and divide by the sum of all four
      generation columns (hydraulica+termica+eolica+solar) to get
      wind_pct and solar_pct for the 2020 historical baseline (D1).
    deprioritized_candidate:
      package_id: geracao-usina-2
      title: "Geracao por Usina em Base Horaria"
      notes: >
        Per-plant hourly generation with 12 columns including
        nom_tipousina/nom_tipocombustivel. Confirmed schema via sample
        download. Demoted to optional cross-check source only, since
        balanco-energia-subsistema already provides a direct SIN-level
        aggregate with no joining required.

aneel:
  base_url: "https://dadosabertos.aneel.gov.br/api/3/action/"
  status: confirmed_ckan_reachable
  notes: >
    package_search for 'geracao' returned 10 real results. Confirmed
    CKAN-based. Remains secondary/fallback only, not wired into the
    default pipeline.

ccee:
  status: blocked_permanent
  http_status_observed: 403
  notes: "See docs/limitations.md. Closed, no further probing planned."

mcti:
  landing_page: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene/dados-e-ferramentas/fatores-de-emissao"
  status: confirmed_fully_mapped
  methodology_note_pdf: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/cgcl/paginas/NT_FE_jun25.pdf"
  methodology_note_summary: >
    As of Jan/2025, ONS expanded the underlying plant database used to
    compute OM (now includes biomass thermal, wind/solar plant clusters
    previously undercounted). Calculation methodology itself is
    unchanged for both MDL and inventory purposes. OM (dispatch-analysis
    method) and the average SIN factor are published MONTHLY. BM and the
    "Simple Adjusted Method" OM are published ANNUALLY.

  average_sin_factor:
    status: confirmed
    concept: "D8 - Average SIN emission factor"
    file_pattern: "Inventario_{year_range}.xlsx, e.g. Inventario_2026_janset.xlsx"
    confirmed_url_example: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene/dados-e-ferramentas/fatores-de-emissao/arquivo/Inventario_2026_janset.xlsx"
    sheet_name: "inventário-todos"
    structure: >
      Consolidated single file, NOT per-year. Contains repeating blocks
      per year from 2006 to present: 12 monthly values
      ("Fator Médio Mensal (tCO2/MWh)") plus 1 annual value
      ("Fator Médio Anual (tCO2/MWh)"). Example: 2006 annual = 0.0323
      tCO2/MWh.
    acquisition_note: >
      Single download covers the full historical series needed for the
      2020 baseline and any later year. No per-year scraping required.

  operating_margin_bm_combined:
    status: confirmed
    concept: "D9 - OM (DEB proxy) and BM, dispatch-analysis method"
    file_pattern: >
      ONE FILE PER YEAR, inconsistent naming across years:
      "Despacho_{YYYY}_*.xlsx" (e.g. 2021, 2024, 2025) OR
      "Margemdeconstruo_{YYYY}*.xlsx" (e.g. 2022, 2023) - same internal
      structure despite different file name conventions. Pre-2021 years
      hosted on legacy domain antigo.mctic.gov.br with pattern
      "Despacho-{YYYY}.xlsx" or consolidated multi-year files under
      cgcl/Banner_Relatorios_Especiais_IPCC/metodo-da-analise-de-despacho/.
    confirmed_url_examples:
      - year: 2025
        url: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene/dados-e-ferramentas/fatores-de-emissao/arquivo/Despacho_2025_jandez_corrigidacomMO.xlsx"
      - year: 2024
        url: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene/dados-e-ferramentas/fatores-de-emissao/arquivo/Despacho_2024_jandezcomcorrees_FE_MC.xlsx"
      - year: 2023
        url: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene/dados-e-ferramentas/fatores-de-emissao/arquivo/Margemdeconstruo_2023corrigido.xlsx"
      - year: 2021
        url: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene/dados-e-ferramentas/fatores-de-emissao/arquivo/Despacho_2021_jandez.xlsx"
    sheet_name: "MDL"
    structure: >
      Per confirmed sample (2025): "MARGEM DE CONSTRUÇÃO" section has a
      single annual value (BM = 0.07106 tCO2/MWh for 2025). "MARGEM DE
      OPERAÇÃO" section has ONLY monthly values (12 values), no direct
      annual figure. A "DIÁRIO" (daily) breakdown also exists further
      down in the sheet (not yet inspected, not needed for v1 annual
      granularity).
    derived_annual_om: >
      IMPORTANT: no officially published annual OM value exists. Must be
      derived as the simple arithmetic mean of the 12 monthly OM values
      for that year (no monthly generation weights are available in this
      file to do a weighted average). This MUST be documented in the
      DataQualityReport / output metadata as a derived quantity, not an
      MCTI-published figure.
    acquisition_note: >
      Because file naming is inconsistent year-to-year, acquisition
      cannot rely on a predictable URL pattern. Must scrape the landing
      page's <a href> list (as done in discovery_probe_3.py /
      discovery_probe_4.py) to find the current file for a target year,
      matching on year substring in href or link text. This is a
      "scrape, don't guess" case, consistent with API-first-but-manual-
      fallback-when-necessary principle. Log every discovered URL in the
      retrieval manifest.

  combined_margin_cm:
    status: NOT_PUBLISHED_MUST_BE_COMPUTED
    concept: "D9 - CM (REB proxy)"
    notes: >
      MCTI does not publish a Combined Margin value anywhere. CM must be
      computed internally from OM and BM using a weighting formula that
      is a METHODOLOGICAL DECISION, not a data-discovery fact. Standard
      UNFCCC CDM practice (e.g., ACM0002 for renewable/low-carbon
      intermittent sources) uses CM = 0.5 x OM + 0.5 x BM by default.
      PENDING CONFIRMATION from docs/methodology.md before Task 5 is
      considered fully closed. If methodology.md is silent on this, the
      0.5/0.5 default should be adopted explicitly and logged as
      decision D12, documented in output metadata as a methodological
      assumption, never silently baked in.

  simple_adjusted_om_secondary:
    status: confirmed_not_primary
    file_pattern: "FE_simplesajustado_{year}_web.xlsx"
    confirmed_url_example: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene/dados-e-ferramentas/fatores-de-emissao/arquivo/FE_simplesajustado_2025_web.xlsx"
    sheet_name: "Publicar"
    structure: >
      Consolidated single file, annual values 2006-present, plus a
      secondary column with total energy dispatched to SIN (MWh) used
      for the methodology's internal weighting. This is an ALTERNATE,
      simpler OM calculation method, not the primary one (dispatch-
      analysis method is preferred per D9's monthly-granularity intent).
      Not used unless the dispatch-analysis OM file is unavailable for a
      given year, in which case fall back to this with
      classification_available-style explicit flagging.

# ---------------------------------------------------------------------------
# Methodological / sourcing decisions recorded from discovery work.
# (D10 CCEE blocked and D12 Combined Margin are documented inline above.)
# ---------------------------------------------------------------------------
decisions:
  D13:
    status: adopted
    date: "2026-10-21"
    topic: "Curtailment energy column (wind and solar)"
    checked: >
      ONS COFF resources (restricao_coff_eolica_usi, restricao_coff_fotovoltaica),
      wind 2022-01 sample: 200,880 rows.
    found: >
      val_geracaoreferenciafinal is populated in only 295 rows;
      val_geracaonaorealizadaapurada (ONS's ascertained curtailed power, MW) is
      populated in 3,746 rows, exactly the rows with cod_razaorestricao set.
      On populated rows it is the figure ONS itself reports as non-realized generation.
    decided: >
      Curtailed energy = val_geracaonaorealizadaapurada x sampling interval (h).
      Blank means no restriction in the interval (0 MWh, logged). Reference-minus-
      realized derivation is used only if the column is absent from a resource,
      with a WARNING.
    why: >
      The reference column is too sparse to derive curtailment from; using ONS's
      own ascertained value avoids a derived quantity with large coverage gaps.
    implemented_in: "curtailmit.data_ingestion.parse_curtailment_frame (Task 2)"

  D14:
    status: adopted
    date: "2026-10-21"
    topic: "Per-package ONS coverage floors; solar 2020 baseline = documented zero"
    checked: >
      (1) ONS resource listings: wind monthly resources 2021-10..2026-10;
      solar 2024-04..2026-10; earliest solar row 2024-04-01 00:00.
      (2) ANEEL CKAN package_search, 13 queries (restricao/curtailment/corte/
      constrained off/fotovoltaica/capacidade instalada/SIGA, PT and EN), 20
      distinct packages: none is a curtailment/constrained-off series (all are
      registries, capacity totals, auctions, inspections, tariffs).
      (3) Capacity corroboration, ANEEL SIGA (siga-empreendimentos-geracao.csv),
      UFV in operation, cumulative by DatEntradaOperacao, centralized plants only
      (MMGD is a separate dataset): 2019 2.5 GW; 2020 3.3 GW; 2021 4.7 GW;
      2022 7.5 GW; 2023 11.6 GW; 2024 17.2 GW; 2025 20.1 GW.
    found: >
      No ANEEL source improves on ONS solar coverage (Branch A). 2020 utility-scale
      PV capacity was about 19% of the 2024 level - low, but not zero, so it
      corroborates a small effect without proving curtailment was nil.
    decided: >
      Coverage floor is read per package from acquisition_targets.yaml
      (wind 2022-01-01, solar 2024-04-01); ONS_MIN_COVERAGE_DATE remains the wind
      default only and is never reused for solar (validation.resolve_ons_min_coverage).
      The 2020 baseline solar curtailment is a DOCUMENTED ZERO (not measured),
      surfaced in the Stage 1 data-quality report and methodology.md 3.7.
    why: >
      Keeps the CoverageError fail-explicit guarantee per package while allowing
      real runs to complete, without silently inventing or back-filling solar data.
    caveat: >
      3.3 GW of PV existed in 2020, so zero is an assumption backed by ONS not
      publishing earlier data, not a measurement. Revisit if ONS back-fills.
    corroborating_context:
      label: "Corroborating context only - NOT proof that 2020 solar curtailment was negligible"
      source: "ANEEL SIGA, siga-empreendimentos-geracao.csv (UFV, DscFaseUsina=Operacao, cumulative by DatEntradaOperacao)"
      scope: "Centralized utility-scale installed capacity only; EXCLUDES distributed generation (MMGD)."
      installed_capacity_gw:
        2019: 2.5
        2020: 3.3
        2022: 7.5
        2024: 17.2
      interpretation: >
        2020 capacity was ~19% of 2024's - small but not zero. Installed capacity
        is not itself evidence about curtailment behavior, so these figures do not
        establish that 2020 solar curtailment was negligible. The documented-zero
        treatment rests on ONS not publishing earlier data (see decided/caveat).

  D15:
    status: adopted
    date: "2026-10-21"
    topic: "ONS generation-by-source: usable history starts 2016"
    checked: >
      ONS balanco-energia-subsistema (SIN rows), yearly resources 2000-2026, probed live.
    found: >
      Series is unreliable before 2016: wind generation is blank for all of 2000-2005 and
      partially blank in 2006; 2015 has 24 hours with no source-level data at all (every source
      NaN). From 2016 on the series is clean; the only blanks are partial val_gersolar in 2016
      (the documented pre-2017 case, treated as 0).
    decided: >
      history_start_year: 2016 in config/acquisition_targets.yaml
      (ons.packages.generation_by_source) is a hard floor for any use of this series; earlier
      yearly resources are never downloaded or silently used. It must not be later than the
      coverage-floor year (ons_generation raises ValidationError otherwise). Applies to the
      acquisition config only - config/scenarios.yaml was not changed.
    why: >
      Fail-explicit rule: refusing to assume zero generation for missing wind/hydro/thermal data.
    caveat: >
      No effect on the 2020 baseline (single fully covered year, 8,784 h) or the 2021+ calibration
      window (fully covered). It only excludes pre-2016 data from ever being used silently.
    implemented_in: "curtailmit.ons_generation (Task 3, commit 3f69554)"

  D16:
    status: adopted
    date: "2026-10-21"
    topic: "Generation basis: ONS SIN (historical) vs PTE/BLUES (projection) - not reconciled by design"
    checked: >
      The gap between ONS SIN total generation in 2020 (554.35 TWh) and the PTE total_generation_twh
      for 2025 (836 / 834 / 836 TWh for TB / TA / TG), documented in docs/pte_ons_basis_investigation.md.
    found: >
      BEN 2021 (EPE Anuario fact sheet) gives a national total of ~621.2 TWh for 2020; ONS SIN is
      ~89% of it. The residual (+66.9 TWh, almost all in the thermal-type block, plus ~5.5 TWh solar)
      is plausibly MMGD + self-production (autoproducao) + isolated systems outside the ONS SIN
      balance. A secondary gap of roughly 5% remains unexplained at 2025 even after adjusting for the
      BEN/ONS ratio (700.4 TWh x ~1.12 = ~785 TWh vs 836 TWh). The PTE report (CEBRI PTE2, Grafico 13)
      does not define what its total includes.
    decided: >
      Historical baseline (2020) and calibration window (2021+) stay on real, reported ONS SIN data
      (source: historical_ons). PTE projection years (2025, 2030, 2040, 2050) use the PTE/BLUES
      total_generation_twh and wind/solar shares AS PUBLISHED, on their own accounting basis, with NO
      rescaling or reconciliation to ONS scope (source: pte_projection). The existing `source` field
      doubles as the generation-basis indicator and must be read as such. No code or config values change.
    why: >
      The PTE scenarios are the object evaluated by the paper (how their stated trajectories fare
      against curtailment reality), not a ground truth to be made to agree with ONS accounting.
      Forcing agreement would defeat the comparison. The BEN cross-check explains WHY the scopes differ;
      it is not used to rescale any value.
    caveat: >
      The calibrated curtailment function C(P), fit on ONS-SIN-basis P, is applied to PTE-basis P(s,t)
      under the ASSUMPTION that curtailment risk scales with wind+solar penetration share regardless of
      the accounting scope of total generation. This is an assumption, not a proven equivalence.
    open_subquestions_non_blocking: >
      Optional discussion-section questions for the PTE/CEBRI authors, NOT pipeline items: the exact
      Grafico 13 definition (MMGD / autoproducao inclusion); the ~5% residual at 2025; the BEN
      autoproducao split (106.5 / 60.7 TWh, secondary source only); whether the ONS hydro excess is
      the Paraguayan share of Itaipu; whether BEN solar includes MMGD.
    reference: "docs/pte_ons_basis_investigation.md"
    implemented_in: "documentation only; behaviour already in projection.py (source labels) and ons_generation.py"

  D17:
    status: adopted
    date: "2026-10-21"
    topic: "Curtailment classification: ONS reason codes -> DEB / REB / EUB"
    checked: >
      Live ONS COFF data (wind 2022-01..2026-10, solar 2024-04..2026-10; 15,776,640 half-hourly plant rows) and the
      JSON data dictionary shipped with each package (field cod_razaorestricao).
    found: >
      Distinct codes in the data: ENE, CNF, REL. The dictionary defines REL = indisponibilidade externa (eletrica),
      CNF = atendimento a requisitos de confiabilidade, ENE = razao energetica, and also PAR = restricao indicada
      no parecer de acesso (PAR never occurs in the data checked). Curtailed energy 2022-01..2026-10 (wind + solar):
      DEB (ENE) 47.75 TWh, REB (CNF) 27.81 TWh, EUB (REL) 10.35 TWh; 2,330 MWh (0.0027%) of curtailed energy has no
      code at all. classification_available = true.
    decided: >
      Two steps, both config-driven: (1) code -> D5 label derived AT RUN TIME from the live dictionary text via
      classification.dictionary_keywords (nothing hardcoded; undocumented code in the data raises
      ClassificationError); (2) label -> DEB/REB/EUB via the existing classification.mapping (D5). EUB stays its own
      category. Documented codes with no D5 label (PAR) and rows without a code get a NULL deb_reb_eub and remain in the
      aggregate - never forced into a category. The flag is global: true only if every source is classifiable,
      otherwise false for all rows with no classified field written (D6). The classified column is named
      deb_reb_eub and was added to validation._CLASSIFIED_FIELDS so the existing leak guard actually covers it.
    why: >
      A full run is 15.8M rows, so the propagation check runs on the distinct (source, deb_reb_eub, flag) record shapes,
      which is equivalent because the rules depend only on those fields.
    caveat: >
      The ONS dictionary is partly published with U+FFFD replacement characters in place of accents/dashes; the parser
      and keyword stems ("energ") are written to tolerate this. The ENE -> DEB / CNF -> REB / REL -> EUB equivalence is
      the project's D5 proxy mapping, not an ONS-defined taxonomy.
    implemented_in: "curtailmit.ons_classification (Task 4)"
    addendum: >
      Correction to Task 4's own deliverable, recorded for traceability (no separate decision number). The original
      leak-guard field list in validation.py (_CLASSIFIED_FIELDS, which stops classified fields from appearing on
      records flagged classification_available=False) did not include deb_reb_eub, so the guard would not have caught
      that column. This was identified and fixed within Task 4 by adding the field name to the existing protected-fields
      list (the column was NOT renamed), with a corresponding test (test_guard_rejects_deb_reb_eub_field_on_unavailable_records).
    magnitude_check: "docs/curtailment_magnitude_sanity_check.md (curtailed energy matches ONS RT DGL 0189/2025 within ~1%)"

  D18:
    status: adopted
    date: "2026-10-21"
    topic: "MCTI emission factors: scraping rules, required years, derived OM/CM"
    checked: >
      Live MCTI landing page (fatores-de-emissao) and every workbook used: Inventario_2026_janset.xlsx, the per-year
      OM/BM files for 2020-2026 (current gov.br domain and legacy antigo.mctic.gov.br).
    found: >
      Page structure matches the documented one (one consolidated Inventario_*, per-year Despacho_/Margemdeconstruo_ files,
      FE_simplesajustado_2025_web). Three undocumented behaviours: (1) gov.br returns a stripped page (no spreadsheet links)
      and an HTML page in place of each .xlsx, both with HTTP 200, to python-requests' default User-Agent, but the real content to
      any explicit User-Agent; (2) the margin sheet name is not stable (MDL, "MDL 2022", Planilha1 for 2020/2021) while its
      label layout is identical in every year; (3) 2020 and 2021 exist on both domains, and 2026 is an in-progress year (9 monthly
      OM values, BM not yet available). Published annual average factors read back match known MCTI values
      (2020 0.0617, 2021 0.1263, 2022 0.0426, 2023 0.0385, 2024 0.0545, 2025 0.0461 tCO2/MWh).
    decided: >
      Requests use an honest project User-Agent (not a browser impersonation) and every download is verified to be a real
      spreadsheet (zip/OLE magic bytes) before parsing. Margin workbooks are parsed by their labels, not by sheet name
      (WARNING when the sheet differs). The per-year file is chosen by margin file-name patterns plus the year as a whole token in
      href or link text; the current domain beats the legacy one; more than one remaining candidate fails (no guessing). Required
      years are explicit in config (mcti.required_years: 2020-2025: 2020 = D1 baseline, 2021+ = calibration window; bump the end
      when MCTI publishes the next complete year). Later years are used only if complete (BM + 12 monthly OM); an in-progress year is
      skipped with a WARNING. The current BM is the first non-empty cell after the year; a text cell there means no BM yet, never
      the "previously published (with errors)" numbers to its right. Annual OM (simple mean of 12 months) and CM (0.5 OM + 0.5 BM,
      D12) are flagged om_is_derived / cm_is_derived in every output; only BM and the average factor are MCTI-published.
    why: >
      Fail-explicit rule with no guessed URLs; the stripped-page/HTML-instead-of-xlsx behaviour would otherwise surface as a confusing
      parse error or, worse, a silent empty result.
    caveat: >
      Margin factors exist only for completed years, so projection years (2025+ grid points) have no factor of their own;
      Task 13 must choose and log how the latest available year is applied. Annual OM is a simple mean because MCTI publishes no
      generation weights. The simple-adjusted OM file (FE_simplesajustado) is not wired in (secondary fallback only, not needed).
    implemented_in: "curtailmit.mcti_client (Task 5)"
    addendum: >
      Correction to Task 5's own deliverable, recorded for traceability (no separate decision number). During testing a
      parsing fragility was found: if the current Build Margin (BM) value was missing but the same row also held a
      "previously published with error" value, the parser would pick up that erroneous value instead of failing explicitly
      or skipping the year. It was identified and fixed within Task 5 (the BM is now the first non-empty cell after the year;
      a text cell there means no BM yet), with a corresponding test added
      (test_parse_margin_grid_incomplete_year_is_flagged_not_silently_filled). Fix shipped in the Task 5 commit (dfe1cb5).

  D19:
    status: adopted
    date: "2026-10-22"
    topic: "ANEEL fallback for generation-by-source: capacity only, explicit invocation"
    checked: >
      ANEEL CKAN (8 candidate queries, 33 distinct packages) for a generation-by-source series usable if ONS (Task 3) fails.
      Not re-probed for curtailment (Task 2B already did: none).
    found: >
      ANEEL publishes no SIN energy-generation (MWh) series by source. Source-level data exists only as installed capacity: the SIGA
      plant registry (generation type, phase, entry date, fiscalized kW; ~25k plants). Other candidates are capacity by UF only (no
      source split), plant counts, the distributed-generation (MMGD) registry, the distributors' energy balance (SAMP-Balanco: energy
      received/injected by source, distribution companies only), hydro royalties (CFURH: hydro only) and a discontinued inspection
      dataset. Centralized capacity from SIGA: solar 3.35 GW (2020) -> 17.24 GW (2024) -> 20.09 GW (2025); wind 17.13 -> 32.88 -> 34.75 GW.
    decided: >
      aneel_client.fetch_generation_fallback returns INSTALLED CAPACITY (MW) and capacity shares by source at year-end, flagged
      quantity=installed_capacity_mw and is_generation_energy=False in every row; it is not a drop-in for the ONS generation-based P(t)
      and invents no capacity factors. It is never invoked by the default pipeline: the caller must pass an explicit reason (the
      documented ONS failure), which is logged as a WARNING. Package choice is a documented deterministic score, logged for every
      candidate with the reasons the others lost, and backed by a schema check on the downloaded file.
    why: >
      Fail-explicit rule: a "fallback" that silently pretended capacity was generation would corrupt the calibration input.
    caveat: >
      SIGA lists only plants in operation, so earlier years are cumulative by entry date and understate retired capacity; MMGD is
      excluded. Using the fallback for P(t) would need an explicit capacity-factor assumption and a new decision.
    side_finding: >
      docs/ons_solar_mmgd_capacity_crosscheck.md: ONS solar generation implies a ~21 percent capacity factor against centralized
      capacity in 2018-2022 but 52-58 percent in 2023-2025, suggesting ONS solar includes estimated MMGD from 2023 (unconfirmed;
      wind shows no break). Flagged for review; no change made.
    implemented_in: "curtailmit.aneel_client (Task 6)"

  D20:
    status: adopted
    date: "2026-10-23"
    topic: "ONS balance val_gersolar includes a non-dispatched (MMGD-like) component from 2023-04-29 onward; centralized-only dispatched solar must be used consistently for both P(t) and the curtailment-rate denominator"
    source_task: "Task 6B (circumstantial) + Task 6C (direct measurement)"
    evidence_measured: >
      Monthly val_gersolar minus ONS-dispatched solar (plant-level capacity-factor
      files, 59 files, schema-checked, 2021-01..2026-10). Clean step on 2023-04-29:
      daily gap 98-105 MWmed until 04-28, then 2,546 / 3,034 / 3,069 MWmed; dispatched
      solar itself has no step, nor do wind/hydro/thermal. From 2023-05 onward the gap
      is a stable 58.8-68.5 percent of val_gersolar every month and grows with
      installed capacity. 2024 annual gap: 45,789 GWh vs ONS's own RT DGL-ONS 0189/2025
      MMGD estimate of 45,752 GWh (ratio 1.0007), well inside the stated +/-10 percent
      tolerance.
    secondary_finding_pre_2023: >
      A smaller, earlier, non-zero gap exists from 2021-03 to 2023-03 (89-197 MWmed,
      5.0-13.1 percent of val_gersolar), roughly 1/30 of the post-2023-04-29 level.
      The 2021-03 onset matches the month ONS's carga-energia notes say non-dispatched
      plants were first added to load. This contradicts the original "near-zero before
      the step" sub-hypothesis but is consistent with a staged MMGD-inclusion history
      (two methodology changes, not one). NOT material to this decision: ONS solar
      curtailment data only exists from 2024-04-01 onward (D14 coverage floor), so the
      window where curtailment-rate and calibration decisions actually apply falls
      entirely within the well-measured, stable post-2023-04-29 regime. Documented as
      a limitation, not resolved further.
    not_confirmed: >
      No ONS document states this for val_gersolar specifically (the balance
      dictionary is silent); the gap may include other non-dispatched-but-not-MMGD
      solar; the RT magnitude check rests on a single year (2024); one glitch day
      (2024-11-09, gap drops to 68 MWmed) is unexplained but isolated.
    decided: >
      For the calibration window (2021 onward) and all curtailment-rate calculations,
      "solar generation" is defined as the directly-measured ONS-dispatched solar
      series (summed from the per-plant capacity-factor dataset acquired in Task 6C,
      interim/ons_solar_dispatched_monthly.parquet), NOT raw val_gersolar. This
      dispatched-solar series is used consistently in BOTH places val_gersolar
      previously fed the pipeline: (1) the solar_pct component of P(s,t), and the
      solar term in the total-SIN-generation denominator used to compute it; (2) the
      "potential generation" (realized + curtailed) denominator of the solar
      curtailment rate. Wind is unaffected (no step found) and continues to use
      val_gereolica as before. The 2020 historical baseline is unaffected (predates
      dataset coverage and both measured steps; D14's documented-zero solar
      curtailment baseline stands). raw val_gersolar remains available in outputs for
      diagnostic/reporting purposes only (e.g., to show total including MMGD) but is
      never the calibration or curtailment-rate basis.
    why: >
      MMGD is never subject to COFF curtailment and is not centrally dispatched, so
      including it in P(t) dilutes the actual penetration-vs-curtailment relationship
      the calibration is meant to capture, and including it in the curtailment-rate
      denominator understates the rate by diluting it with non-curtailable energy.
      Using the directly-measured dispatched series (rather than an assumed capacity
      factor, as in the earlier Task 6 sanity check) keeps the correction grounded in
      measurement, not assumption.
    caveat: >
      This is a project-level methodological choice, not an ONS-confirmed fact for
      this specific field. The pre-2023-03 secondary gap is not corrected for (no
      curtailment data exists in that window to be affected). Does not alter D16
      (ONS-SIN vs PTE-basis treatment of projection years) in any way.
    implemented_in: "commit 224ad96 (Task 9: ons_generation.py P(t) tables, ons_solar_gap.py, calibration.py wiring); report docs/task9_calibration_report.md"

  D21:
    status: adopted
    date: "2026-10-23"
    topic: "Calibration curve: L bounded to (0, 1]; wind-only months kept; bootstrap uncertainty mandatory for Stage 3"
    source_task: "Task 9 (docs/task9_calibration_report.md), resolved in Task 7C"
    found: >
      The unconstrained logistic on the D20 basis (57 monthly points 2022-01..2026-09, P 10.3-29.4 percent) gave L=1.254, i.e. curtailment above
      100 percent at high P (C(60)=1.23). The constrained fit has the same RMSE, so the data do not discriminate. Including vs excluding the
      27 wind-only months moves the extrapolated C(50) from 0.93 to 0.60. PTE scenario penetration is 26-29 percent in 2025-2030 (inside the
      observed range) and 36-58 percent in 2040-2050 (outside it in every scenario).
    decided_L: >
      fit_calibration bounds 0 < L <= 1 (bounded, not fixed) and k > 0. Rationale: L is a curtailment fraction, so L > 1 is physically impossible;
      the in-sample RMSE is unchanged (0.06123 vs 0.0612), so the bound removes the impossibility at no cost in fit. The bounded full-sample fit
      lands ON the bound (L = 1.000, k = 0.1688, P0 = 34.82): the data do not support a plateau below 100 percent, they just do not reach it.
    decided_wind_only_months: >
      The 27 wind-only months stay in the calibration frame as they are (scope flag kept). The Task 7C check did NOT show that excluding them is
      statistically unsupportable in the sense of a degenerate fit: with L bounded, the 30 solar-coverage months (P 15.1-29.4) give a
      well-behaved fit (L=1, k=0.0765, P0=44.5, RMSE 0.0603), no longer the degenerate L=2236 / P0=169 of the unconstrained run. What does hold is
      that the two choices disagree materially outside the data (C(50) 0.93 vs 0.60; the all-months point estimate lies outside the solar-only 95
      percent interval for P >= 40) and that both place P0 beyond the observed range, so neither identifies the upper part of the curve. The
      all-months fit is kept because it uses every measured month (57 vs 30) and anchors the low-P tail (P 10-15 percent, C near 0), which the
      solar-only window (15.1-29.4) lacks. The solar-only fit is reported next to it as a structural sensitivity (docs/task9_calibration_report.md).
    unresolved_residual_limitation: >
      The wind-only months have left-censored curtailment (solar curtailment unpublished before 2024-04, D14), which biases their C slightly low at a
      given P. The absolute size of this bias is small because solar capacity was lower in 2022-2024 (D14 corroboration: 3.3 GW in 2020, 7.5 GW in 2022,
      17.2 GW in 2024). Documented, not corrected. The size of the bias was not measured.
    stage3_requirement: >
      Stage 3 (PTE scenario application, a future task) MUST propagate the calibration uncertainty into the reported mitigation-deficit figures,
      most of all for 2040 and 2050, instead of using point estimates alone: use bootstrap_calibration_ci (calibration.py) and also show the
      solar-only sensitivity. Bootstrap (1000 resamples of the 57-month frame, 95 percent percentile interval) is reported in
      docs/task9_calibration_report.md and stored in processed/calibration_ci_bootstrap.parquet. Width of the C interval: 0.13 at P=29.4, 0.45 at 36,
      0.74 at 50, 0.76 at 58 (it saturates because C is confined to [0, 1]). The interval covers sampling uncertainty only, not the logistic form.
    superseded_in_part_by: >
      D22 (Task 7D). The L <= 1 bound and the bootstrap requirement of this decision still apply, now PER CURVE (C_wind and C_solar). The
      structural-divergence question (wind-only months) is resolved by D22's two-curve split, not by keeping the 27 wind-only months inside a
      single combined curve as decided in 'decided_wind_only_months' above; that paragraph and the combined bootstrap numbers are kept as the
      record of the non-primary diagnostic curve.
    implemented_in: "Task 7C: calibration.fit_calibration (bounds), calibration.bootstrap_calibration_ci"

  D22:
    status: adopted
    date: "2026-10-23"
    topic: "Two technology-specific curtailment curves, C_wind(P) and C_solar(P), on the shared driver P = solar_pct + wind_pct"
    source_task: "Task 7D; supersedes the 'bracketing two alternative fits' direction drafted after Task 7C Part B (never implemented)"
    found: >
      Task 7C Part B showed that the combined single-curve fit diverges materially depending on whether the 27 months before solar curtailment
      is published (2022-01..2024-03) are included (C(50) 0.93 vs 0.60). Cause (scope mismatch in the dependent variable): in those 27 months the
      frame's C is a WIND-only rate (solar curtailment is unmeasured, D14), while in the other 30 months it is a combined wind+solar rate. One
      logistic then mixes two different quantities. (The frame's denominators in the 27 months already excluded solar; the mismatch is in what
      C measures, not in a solar term inside the wind denominator.)
    decided: >
      Two independent logistic curves (bounded 0 < L <= 1, k > 0, as in D21), both functions of the SAME combined penetration
      P = solar_pct + wind_pct (project modeling spec unchanged; no curve is fit against its own technology share alone).
      C_wind(P): dependent variable = wind curtailed energy / (wind generation + wind curtailed), window = all 57 complete months from 2022-01.
      C_solar(P): dependent variable = solar curtailed energy / (dispatched solar generation + solar curtailed) (D20 basis), window = the 30
      months with published solar curtailment (2024-04 onward, D14 floor). Combination rule for Stage 3 (documented, not yet implemented):
      curtailed wind = wind_gen x C_wind(P), curtailed solar = solar_gen x C_solar(P), each technology's own projected generation and the
      scenario's combined P; total = sum. The earlier single combined curve (all 57 months, total VRE rate) is retained ONLY as a non-primary
      diagnostic for comparison with ONS's combined rate and must not be used for Stage 3 deficits.
    does_not_alter: "D16 (PTE vs ONS basis), D20 (dispatched-solar basis), and the core P(s,t) = solar_pct + wind_pct architecture."
    results: "docs/task9_calibration_report.md (section 'Two-curve calibration')"
    caveat: >
      Both curves still end at the same observed maximum P (29.4 percent) and place P0 beyond it, so every PTE point above 29.4 percent is an
      extrapolation for both curves; the bootstrap interval (sampling uncertainty only) must be propagated by Stage 3 (D21).
    implemented_in: "Task 7D: calibration.build_technology_frames, TechnologyCurve, CalibrationResult, run_calibration"

  D23:
    status: pending
    date: "2026-10-23"
    topic: "Gross (potential) vs net (delivered) basis of the PTE/BLUES generation, and the E_curt formula"
    source_task: "Task 11C section (a) - docs/task11c_investigation_report.md"
    found: >
      The CEBRI PTE2 technical report never says whether the published generation is before or after curtailment; curtailment is not modeled (policy
      risk only, PDF pp. 62 and 64) and the NEWAVE step takes "as quantidades de energia definidas no cenario" (PDF p. 110). No wind/solar capacity is
      published, so PTE capacity factors cannot be computed. Indicative 2025 cross-check against ONS (scope not reconciled, D16): PTE wind 117.0 TWh vs
      ONS realized 115.4 (+1.5 percent) and potential 141.6 (-17.3 percent); implied capacity 35.0 GW at the observed realized capacity factor vs ANEEL
      SIGA 34.75 GW. PTE solar 100.3 TWh vs ONS balance realized 91.8 (+9.2 percent) and realized + centralized curtailed 102.8 (-2.4 percent): the two
      technologies point in opposite directions.
    options:
      gross: "E_curt = generation x C (the Task 11B formula; PTE generation read as potential)"
      net: "E_curt = generation x C / (1 - C) (PTE generation read as delivered); with the current extrapolated C it gives implied potentials up to 25,142 TWh (TA 2050 wind) vs total PTE generation of 1,417 TWh, i.e. unusable"
      redefine_rate: "calibrate the rate on realized generation (curtailed / realized) so that a delivered-type PTE generation is the right base without a division (a calibration change)"
    sensitivity: "net / gross ratio 1.9x (TB 2040 solar) to 43.3x (TA 2050 wind) at the Task 11B central C"
    working_reading: "low confidence: closer to a delivered (net-like) quantity, because a model without curtailment reports what it dispatches; not a finding"
    task11e_note: "Task 11E: still no new evidence on gross vs net; the options table in docs/task11e_findings.md uses the gross formula throughout. D23 does not block D24 or D25."
    task11d_note: "Task 11D keeps the Task 11B gross formula (wind curtailed = generation x C) in all its prototype numbers; they would all shift if this is decided otherwise. No new evidence on gross vs net was found (PTE has no regional or capacity data)."
    decided: "nothing; to be decided by the user (candidate action: ask the PTE/CEBRI authors what Grafico 13 represents)"

  D24:
    status: pending
    date: "2026-10-23"
    updated: "2026-10-22 (Task 11D rewrite; the Task 11C text is preserved in docs/task11c_investigation_report.md)"
    topic: "Adopt the regional / pooled formulation as the project's driver of the curtailment rate, replacing or augmenting national P"
    source_task: "Task 11C (b),(c) and Task 11D - docs/task11c_investigation_report.md, docs/task11d_findings.md"
    proposal: >
      Replace (or augment) the national-P logistic curves of D21/D22 by a formulation in which the curtailment rate is driven by regional penetration, calibrated on the Northeast
      (within-sample P_NE = 49-84 %) and bounded by a pooled international plausibility band, with the national curve retained at most as a sensitivity. Solar has no regional
      high-penetration sample and would need a separate treatment.
    evidence:
      for: >
        Northeast wind logistic L = 0.25, k = 0.16, P0 = 76 (57 months) reduces 2050 wind curtailment from 322-568 TWh (87-98 %) to 79-129 TWh (21-22 %), inside the international envelope
        (N. Ireland 29.6 %, Ireland 14 %, South Australia 11 %); pooled annual fractional logit gives 5.6 / 7.2 / 10.2 % at P = 44 / 58 / 78 %; curtailment in S, SE and N occurs at very low local P
        (so national P does not locate it); the 11D time-confound test shows P is not established as the driver of C in the Northeast.
      against: >
        NE asymptote not identified (L 95 % bootstrap interval 0.12-1.0; L = 0.07 vs 1.0 in the two halves of the sample); PTE has no regional generation, so P_NE for 2040/2050 rests on a constant-share proxy and
        exceeds the observed maximum (85-94 % vs 83.6 %); the regional model underpredicts observed 2025 curtailment (16.4 vs 26.2 TWh); no regional solar sample (solar total stays dominated by the extrapolated national curve);
        the pooled panel has four international points from three systems with non-identical definitions; time explains most of the NE relation (D25), so replacing national P by P_NE re-exports the same confound.
    options:
      A: "Adopt the regional (NE) curve for wind as the primary, national curve as sensitivity; solar decided separately"
      B: "Adopt it as an alternative scenario reported alongside the national one (not a replacement)"
      C: "Reject: keep the national P curves (D21/D22) with the existing caveats"
      D: "Defer until a solar treatment and transmission-expansion / mechanism-aware data (a possible future acquisition, NOT started) are available"
    working_reading: "Task 11D author's reading, not a decision: B or D; A is not supported for solar, and the total does not become plausible until solar is addressed"
    options_added_in_task11e:
      E: "Hourly dose-response driver: wind and solar curtailment as stationary functions of the hourly system-wide potential VRE share of load r, applied to the PTE-scaled hourly profile of 2025 (no regional proxy). Not part of options A-D drafted in Task 11D."
    task11e_update:
      numeric_ranges_twh_wind_plus_solar_central_low_high: >
        C national curves (Task 11B): TB 2040 175 (87-221), TB 2050 513 (138-566), TA 2040 356 (117-423), TA 2050 775 (188-810), TG 2040 256 (105-321), TG 2050 482 (140-550).
        A regional wind envelope (L 0.25/0.5/1.0, capacity-grounded low) + hourly solar: TB 2040 117 (112-123), TB 2050 237 (195-282), TA 2040 193 (172-218), TA 2050 344 (301-427), TG 2040 155 (144-168), TG 2050 234 (200-273).
        E hourly dose-response, wind and solar: TB 2040 128 (127-135), TB 2050 355 (344-432), TA 2040 242 (238-275), TA 2050 536 (516-680), TG 2040 181 (179-197), TG 2050 334 (326-396).
        D defer: bracket across all computed approaches TB 2040 87-221, TB 2050 138-566, TA 2040 117-423, TA 2050 188-810, TG 2040 105-321, TG 2050 140-550. B = A and C reported as two labelled lines.
      evidence_added: >
        Solar: midday potential VRE share of load explains monthly C_solar with R2 0.78 (national P 0.40), so solar need not stay on the national annual curve. Wind L is not identifiable (same RMSE for L 0.25/0.5/1.0): regional 2050 wind 79-245 TWh over L.
        The hourly relation curtailment rate vs system-wide VRE share of load is stable across years and reproduces the monthly wind rate with R2 0.76 without time. NE export is saturated (>= 95 % of the trailing maximum) in only 1-8 % of curtailed energy;
        capacity stocks are collinear with time (0.92-0.99). Caveats: option E holds today's flexibility fixed and 12-40 % of 2050 hours exceed the observed range of r (maximum 75.8 %); A rests on the constant NE-share proxy; sensitivity to flexibility (r/1.25, r/1.5) lowers TA 2050 E from 536 to 476 and 406 TWh.
      working_reading: "Task 11E author's reading, not a decision: E for 2030-2040 and a flexibility-conditional envelope A-E-C for 2050; A is no longer the only way to get plausible magnitudes."
    decided: "nothing; to be decided by the user"

  D25:
    status: pending
    date: "2026-10-22"
    topic: "Time confound: the P -> C_wind relation in the Northeast is mostly a time trend"
    source_task: "Task 11D, sub-task 11D-b - docs/task11d_findings.md (originally noted in Task 11C (c) as C correlating more with time than with national P)"
    found: >
      Northeast, 57 months, C_wind on P_NE and month index t, OLS with Newey-West errors. corr(C,P) 0.61 (Spearman 0.70); corr(C,t) 0.85 (0.90); corr(P,t) 0.65. Partial correlation of C with P given t: 0.14 (p = 0.32); partial Spearman 0.38 (p = 0.004).
      R2: P only 0.373, t only 0.728, P + t 0.733 (incremental R2 of P = 0.005). Slope of P: 0.0066 alone, 0.0010 with t (-85 %, p = 0.36), -0.0006 with load and hydrology proxies, -0.0011 with month dummies. Last 30 months (P and t uncorrelated, -0.11):
      partial r = 0.43 (p = 0.02), but b_P = -0.0001 (p = 0.97) once load and hydrology are added and 0.0042 (p = 0.087) with month dummies. Within-year (year fixed effects) b_P = 0.0032 (p = 0.002), read as seasonality. National wind frame, same months: partial corr(C, P_nat | t) = 0.42 (p = 0.0015).
    candidate_text: >
      In the Northeast sample the apparent P -> C_wind relation is mostly a time trend: time explains about 73 % of the variance and P_NE adds 0.5 percentage points. P_NE is not retained as a causal driver without a time / load / hydrology control,
      and any projection that uses P (national or regional) must state this caveat. Descriptive, 57 months, one regime; no causal claim.
    task11e_update: >
      Mechanism of the time effect (Task 11E): the monthly "time trend" is largely the upward shift of the hourly distribution of the system-wide potential VRE share of load r (p95 of r 26, 29, 36, 46, 47 % in 2022-2026) acting on a stable hourly dose-response curve.
      A fixed hourly curve reproduces the national monthly wind rate with R2 0.76 (time alone 0.73); adding time gives 0.86 (partial corr of t given the curve 0.65), i.e. a residual under-prediction of 2-3 pp in 2025-26 is unexplained. Capacity stocks reconstructed from ONS registries are collinear with time (0.92-0.99)
      and do not replace it; VRE potential / boundary capacity beats P_NE net of time (partial 0.60 vs 0.14) but time stays significant. Candidate text refinement: P (national or regional, monthly) is a coarse proxy of the hourly system-wide VRE share of load; the caveat on the time confound applies to monthly P, not to the hourly driver.
    decided: "nothing; to be decided by the user"

