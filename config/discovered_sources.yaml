  base_url: "https://dadosabertos.ccee.org.br/"
  status: blocked
  http_status_observed: 403
  response_title_observed: "Acesso bloqueado"
  notes: >
    Both package_list and root URL returned HTTP 403 with a WAF/bot-block
    page (not a CKAN permission error). Plain requests.get() with default
    headers is blocked by a CDN/WAF challenge.
  next_step: >
    Retry once with a realistic browser User-Agent header
    (scripts/discovery_probe_2.py). If still blocked, document as a hard
    limitation and keep pld.enabled: false permanently (non-blocking
    optional module). Do not spend further Claude Code tokens on CCEE
    beyond this one retry.

