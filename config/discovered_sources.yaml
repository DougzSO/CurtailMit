# formally merged into scenarios.yaml by a dedicated Claude Code task.

ons:
  base_url: "https://dados.ons.org.br/api/3/action/"

  curtailment_wind:
    status: confirmed
    package_id: restricao_coff_eolica_usi
    notes: >
      Monthly CSV/XLSX/PARQUET resources, naming pattern
      Restricoes_coff_eolicas-YYYY-MM. Confirmed via package_show.

  curtailment_solar:
    status: confirmed
    package_id: restricao_coff_fotovoltaica
    title: "Dados de Restricao de Operacao por Constrained-off de Usinas Fotovoltaicas"
    found_via_search_id: 25b2c170-94f2-4a20-a942-95a2234cc527
    notes: >
      Mirrors the wind curtailment package structure. Confirm the monthly
      resource naming pattern via package_show before wiring acquisition.
    secondary_candidates:
      - package_id: coff_fotovoltaica_intrasemihora
        title: "Constrained-off Fotovoltaicas Intra SemiHora"
        notes: "Higher-frequency variant, not needed for v1 monthly aggregation."
      - package_id: restricao_coff_fotovoltaica_detail
        title: "Constrained-off Fotovoltaicas - Detalhamento Por Usinas"
        notes: "Plant-level detail, not needed for v1 SIN-level scope (OQ-1)."

  generation_by_source:
    status: unresolved_narrowed
    notes: >
      No single clean "generation by source" package found via
      package_search. Narrowed to two candidates requiring package_show
      plus one sample resource schema inspection before selection.
    candidates:
      - package_id: geracao-usina-2
        title: "Geracao por Usina em Base Horaria"
        notes: >
          Per-plant hourly generation. Requires joining with plant
          metadata (source type) to aggregate solar/wind/hydro/thermal
          shares. Heavier, but likely most authoritative.
      - package_id: balanco-energia-subsistema
        title: "Balanco de Energia nos Subsistemas"
        notes: >
          Energy balance by subsystem; unclear whether broken down by
          source type at resource level. Needs schema inspection.
    deprioritized_candidates:
      - package_id: fator-capacidade-2
        title: "Fator de Capacidade de Geracao Eolica e Solar"
        notes: "Capacity factor, not generation volume. Cross-check use only."
    action_required: >
      Claude Code Task 3: run package_show on geracao-usina-2 and
      balanco-energia-subsistema, inspect one sample resource schema from
      each, report column names before writing any acquisition code.
      Do not guess the schema.

aneel:
  base_url: "https://dadosabertos.aneel.gov.br/api/3/action/"
  status: confirmed_ckan_reachable
  notes: >
    package_search for 'geracao' returned 10 real results. Confirmed
    CKAN-based. Remains secondary/fallback only, not wired into the
    default pipeline.

ccee:
  base_url: "https://dadosabertos.ccee.org.br/"
  status: blocked_permanent
  http_status_observed: 403
  response_title_observed: "Acesso bloqueado"
  notes: >
    Both package_list and root URL returned HTTP 403 with a WAF/bot-block
    page on two separate probes, including one with a realistic browser
    User-Agent and Accept-Language header. This is a CDN/WAF-level block,
    not a CKAN permission error, and does not respond to header changes.
  decision: >
    CLOSED. Do not spend further time or Claude Code tokens probing CCEE
    programmatically. Document this as a known limitation in
    docs/methodology.md (section on PLD / Task 7). pld.enabled remains
    false permanently as the default. If PLD is ever required, the only
    viable path is manual download, isolated in manual_ingestion.py, with
    this limitation explicitly logged.

mcti:
  candidate_landing_page: "https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene"
  status: strong_candidates_found_files_not_yet_extracted
  http_status_observed: 200
  notes: >
    Link extraction (BeautifulSoup) on the SIRENE landing page surfaced
    two strong, real candidate pages (not guessed):
      1. https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/sirene/dados-e-ferramentas/fatores-de-emissao
         link text: "Fatores de emissão MDL/SIN"
         This is the primary candidate: title directly references both
         SIN (average factor) and MDL methodology (OM/BM/CM margins).
      2. https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/cgcl/#fatores
         link text: "Fatores de emissão de CO2"
         Secondary/older candidate, same content area (CGCL = Coordenação-
         Geral de Clima, the body historically responsible for publishing
         these factors).
  action_required: >
    Claude Code Task 5: fetch both candidate pages above, extract all
    <a href> links ending in .xls/.xlsx/.csv/.zip or containing
    "fator"/"emissao"/"margem" in href or link text, and report the
    exact file URLs found before writing any acquisition code. If
    neither page yields a usable file link, STOP and report back rather
    than guessing further sub-paths.