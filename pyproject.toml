[project]
name = "curtailmit"
version = "0.1.0"
description = "Curtailment-driven mitigation deficit under PTE/EPE scenarios"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require live network access (deselect with -m \"not integration\")",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
