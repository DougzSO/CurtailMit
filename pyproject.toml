[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curtailmit"
version = "0.1.0"
description = "Quantifying the curtailment-driven CO2 mitigation deficit under Brazil's PTE/EPE energy transition scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Douglas" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "responses>=0.25",
    "statsmodels>=0.14",
]

[project.scripts]
curtailmit-run = "curtailmit.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not integration\""
markers = [
    "integration: marks tests that require the local curtailmit_database (never present in CI) and/or live network access (deselect with: pytest -m \"not integration\")",
]

[tool.black]
line-length = 250

[tool.ruff]
line-length = 250